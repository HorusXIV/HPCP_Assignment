name: CI (Poetry)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: self-hosted

    container:
      image: python:3.12-slim
      options: --cpus=2 --memory=2g

    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Python comes from the container; do NOT use setup-python here.

      - name: Install OS deps (optional but handy for builds)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential
          rm -rf /var/lib/apt/lists/*

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Ensure the poetry bin dir is on PATH inside the container shell
      - name: Ensure Poetry on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          which poetry || true
          poetry --version
          python --version
          poetry install --no-interaction --no-ansi

      - name: Lint
        run: |
          if poetry run ruff --version >/dev/null 2>&1; then
            poetry run ruff check .
          elif poetry run flake8 --version >/dev/null 2>&1; then
            poetry run flake8 .
          else
            echo "No linter found. Add 'ruff' or 'flake8' to dev-dependencies."
            exit 1
          fi

      - name: Run tests
        run: |
          if poetry run pytest --version >/dev/null 2>&1; then
            poetry run pytest -q
          else
            echo "pytest not found. Add 'pytest' to dev-dependencies."
            exit 1
          fi
