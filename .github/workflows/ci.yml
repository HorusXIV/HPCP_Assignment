name: CI (Poetry)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: self-hosted

    container:
      image: python:3.12-slim
      options: >-
        --cpus=2 --memory=2g
        -v /cache/apt:/var/cache/apt
        -v /cache/aptlists:/var/lib/apt/lists

    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4


      - name: Cache pip & poetry caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Configure Poetry venv location
        run: poetry config virtualenvs.in-project true

      - name: Cache .venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('poetry.lock') }}


      - name: Install OS build deps (for C/C++ extensions)
        run: |
          apt-get update && apt-get install -y --no-install-recommends eatmydata
          DEBIAN_FRONTEND=noninteractive eatmydata apt-get install -y --no-install-recommends g++

      - name: Upgrade pip tooling
        run: python -m pip install -U pip setuptools wheel

      - name: Install dependencies
        run: |
          poetry --version
          python --version
          poetry install --no-interaction --no-ansi

      - name: Lint
        run: |
          if poetry run ruff --version >/dev/null 2>&1; then
            # ruff: return 0 even if there are issues
            poetry run ruff check --exit-zero .
          elif poetry run flake8 --version >/dev/null 2>&1; then
            # flake8: return 0 even if there are issues
            poetry run flake8 --exit-zero .
          else
            echo "::warning::No linter found. Add 'ruff' or 'flake8' to dev-deps."
          fi

      - name: Run tests
        run: |
          if poetry run pytest --version >/dev/null 2>&1; then
            poetry run pytest -q
          else
            echo "pytest not found. Add 'pytest' to dev-deps."
            exit 1
          fi